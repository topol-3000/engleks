# Deploys a commit to the production server over SSH. The server's forced command
# (deploy/server/engleks-deploy) does the work and rolls back on failure; this job only
# streams its output and turns red when it exits non-zero.
#
# A separate workflow because CI cancels its in-progress runs on every push, and a deploy
# must never be interrupted halfway. Runs automatically after a green CI run for a push to
# main; "Run workflow" with an older SHA rolls back.
#
# Deploys run one at a time and are never cancelled. GitHub keeps only the newest pending
# run in a concurrency group, so when several merges land during a deploy, the SHAs in
# between may be skipped; the newest one still deploys.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: Full 40-character commit SHA whose images are in GHCR
        required: true
        type: string

permissions: {}

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    environment: production
    # Worst case: 15 min waiting for the lock, then a deploy and a rollback (two pulls and two
    # 180 s waits). If the job still times out, the server finishes the deploy or rollback on
    # its own (engleks-deploy survives a lost SSH client); its log is /opt/engleks/.deploy.log.
    timeout-minutes: 40
    steps:
      - name: Deploy over SSH
        env:
          SHA: ${{ github.event.workflow_run.head_sha || inputs.sha }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          if [[ ! $SHA =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::not a full lowercase commit SHA: $SHA"
            exit 1
          fi
          # Re-running an old CI run fires this workflow again. Automatic deploys only ever
          # deploy main's current head, so production never moves backwards by accident;
          # a rollback is a manual "Run workflow".
          if [[ $EVENT == workflow_run ]]; then
            head=$(git ls-remote "https://github.com/$REPO" refs/heads/main | cut -f1)
            if [[ $head != "$SHA" ]]; then
              echo "::notice::not deploying $SHA: main's head is now $head"
              exit 0
            fi
          fi
          install -d -m 700 ~/.ssh
          install -m 600 /dev/null ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/deploy_known_hosts
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/deploy_known_hosts \
            -o ServerAliveInterval=30 "deploy@$DEPLOY_HOST" "$SHA"
