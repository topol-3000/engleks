# Production stack: only the api and the bot run here (migrate is a one-off job before api).
# Postgres and the LiteLLM proxy run elsewhere, so this file stands alone: do not combine it
# with compose.yaml. Run with `docker compose -f compose.prod.yaml up -d --build`, or set
# COMPOSE_FILE=compose.prod.yaml in the server's .env.
#
# Every setting is an environment variable on the service that uses it.
# API_DB_CONNECTION_STRING is postgresql+asyncpg://user:password@host:port/db, with the password
# percent-encoded. Inside a container localhost is the container itself: use a reachable address.
# API_SERVICE_TOKEN and BOT_SERVICE_TOKEN must be equal.
name: engleks-prod

x-service: &service
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "5"

services:
  migrate:
    <<: *service
    # Reuses the image built by the api service; building it twice in parallel collides.
    image: engleks-api:prod
    pull_policy: never
    command: ["alembic", "upgrade", "head"]
    environment:
      # env.py builds the full Settings, so migrate needs the api's required values too.
      API_DB_CONNECTION_STRING: ${API_DB_CONNECTION_STRING:?set API_DB_CONNECTION_STRING}
      API_SERVICE_TOKEN: ${API_SERVICE_TOKEN:?set API_SERVICE_TOKEN}
      API_LLM_API_KEY: ${API_LLM_API_KEY:?set API_LLM_API_KEY}
      API_LOG_FORMAT: json
      API_LOG_LEVEL: ${API_LOG_LEVEL:-INFO}

  api:
    <<: *service
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: engleks-api:prod
    environment:
      API_DB_CONNECTION_STRING: ${API_DB_CONNECTION_STRING:?set API_DB_CONNECTION_STRING}
      API_SERVICE_TOKEN: ${API_SERVICE_TOKEN:?set API_SERVICE_TOKEN}
      API_LLM_API_KEY: ${API_LLM_API_KEY:?set API_LLM_API_KEY}
      API_LLM_BASE_URL: ${API_LLM_BASE_URL:?set API_LLM_BASE_URL}
      API_LLM_MODEL: ${API_LLM_MODEL:-engleks-rewrite}
      API_RATE_LIMIT_PER_MINUTE: ${API_RATE_LIMIT_PER_MINUTE:-10}
      API_DAILY_TOKEN_BUDGET: ${API_DAILY_TOKEN_BUDGET:-200000}
      API_BOT_USERNAME: ${API_BOT_USERNAME:-}
      API_LOG_FORMAT: json
      API_LOG_LEVEL: ${API_LOG_LEVEL:-INFO}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  bot:
    <<: *service
    build:
      context: .
      dockerfile: apps/bot/Dockerfile
    image: engleks-bot:prod
    environment:
      BOT_TELEGRAM_TOKEN: ${BOT_TELEGRAM_TOKEN:?set BOT_TELEGRAM_TOKEN}
      BOT_SERVICE_TOKEN: ${BOT_SERVICE_TOKEN:?set BOT_SERVICE_TOKEN}
      BOT_API_BASE_URL: http://api:8000
      BOT_LOG_FORMAT: json
      BOT_LOG_LEVEL: ${BOT_LOG_LEVEL:-INFO}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
