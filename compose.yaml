name: engleks

x-api-env: &api-env
  API_DB_HOST: postgres
  API_DB_PORT: "5432"
  API_DB_NAME: ${API_DB_NAME:-engleks}
  API_DB_USER: ${API_DB_USER:-engleks}
  API_LOG_FORMAT: json
  API_LOG_LEVEL: ${API_LOG_LEVEL:-INFO}
  API_LLM_BASE_URL: http://litellm:4000/v1
  API_LLM_MODEL: ${API_LLM_MODEL:-engleks-rewrite}

# migrate builds the full Settings in env.py, so it gets the same secrets as api.
x-api-secrets: &api-secrets
  - source: db_password
    target: api_db_password
  - source: service_token
    target: api_service_token
  - source: api_llm_key
    target: api_llm_api_key

services:
  postgres:
    # Keep in sync with POSTGRES_IMAGE in apps/api/tests/integration/conftest.py.
    image: postgres:18.6-trixie@sha256:3a4264520e121176619f54ff867d12774bc81e95e7b84db58d63bccdb6144b81
    environment:
      POSTGRES_USER: ${API_DB_USER:-engleks}
      POSTGRES_DB: ${API_DB_NAME:-engleks}
      POSTGRES_PASSWORD_FILE: /run/secrets/api_db_password
    secrets:
      - source: db_password
        target: api_db_password
      - litellm_db_password
    volumes:
      - pgdata:/var/lib/postgresql
      # Runs only on an empty data directory: creates the proxy's role and database.
      - ./deploy/postgres/init-litellm.sh:/docker-entrypoint-initdb.d/10-litellm.sh:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      # -h forces TCP: during first init the entrypoint's temporary server listens on the
      # Unix socket only, so a socket check would pass before postgres accepts connections.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    # Reuses the image built by the api service; building it twice in parallel collides.
    image: engleks-api:local
    pull_policy: never
    command: ["alembic", "upgrade", "head"]
    environment: *api-env
    secrets: *api-secrets
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: engleks-api:local
    environment: *api-env
    secrets: *api-secrets
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  litellm:
    # Our thin image over the digest-pinned upstream one: see deploy/litellm/Dockerfile.
    build:
      context: deploy/litellm
    image: engleks-litellm:local
    entrypoint: ["/bin/sh", "/deploy/entrypoint.sh"]
    environment:
      LLM_UPSTREAM_MODEL: ${LLM_UPSTREAM_MODEL:?set LLM_UPSTREAM_MODEL}
      LLM_UPSTREAM_API_BASE: ${LLM_UPSTREAM_API_BASE:?set LLM_UPSTREAM_API_BASE}
      LITELLM_LOG: INFO # the image defaults to DEBUG, which logs request bodies
    volumes:
      - ./deploy/litellm:/deploy:ro
    secrets:
      - litellm_master_key
      - litellm_db_password
      - litellm_ui_username
      - litellm_ui_password
      - openai_api_key
      - anthropic_api_key
    networks: [default, llm]
    # Admin UI at /ui: localhost only (prod: SSH tunnel).
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 90s # runs its Prisma migrations on startup
    restart: unless-stopped

  bot:
    build:
      context: .
      dockerfile: apps/bot/Dockerfile
    image: engleks-bot:local
    environment:
      BOT_API_BASE_URL: http://api:8000
      BOT_LOG_FORMAT: json
      BOT_LOG_LEVEL: ${BOT_LOG_LEVEL:-INFO}
    secrets:
      - source: service_token
        target: bot_service_token
      - source: telegram_token
        target: bot_telegram_token
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.40.13@sha256:b2f0122c476bc9fe7ce679d8bb4bd555351e25e2554eefb156f61cb0a89cf429
    profiles: [dev]
    volumes:
      - ollama:/root/.ollama
    # Only litellm shares this network, so nothing else can reach ollama. Not internal:
    # ollama pulls models through it. Pull with `docker compose exec ollama ollama pull ...`.
    networks: [llm]

secrets:
  db_password:
    environment: API_DB_PASSWORD
  service_token:
    environment: BOT_SERVICE_TOKEN
  telegram_token:
    environment: BOT_TELEGRAM_TOKEN
  api_llm_key:
    environment: API_LLM_API_KEY
  litellm_master_key:
    environment: LITELLM_MASTER_KEY
  litellm_db_password:
    environment: LITELLM_DB_PASSWORD
  litellm_ui_username:
    environment: LITELLM_UI_USERNAME
  litellm_ui_password:
    environment: LITELLM_UI_PASSWORD
  openai_api_key:
    environment: OPENAI_API_KEY
  anthropic_api_key:
    environment: ANTHROPIC_API_KEY

networks:
  default: {}
  llm: {}

volumes:
  pgdata:
  ollama:
