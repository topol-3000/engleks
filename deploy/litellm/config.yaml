# One config for dev and prod: only the upstream (env) changes. The API always asks for
# engleks-rewrite and never knows which provider serves it.
model_list:
  - model_name: engleks-rewrite
    litellm_params:
      model: os.environ/LLM_UPSTREAM_MODEL
      api_base: os.environ/LLM_UPSTREAM_API_BASE
      api_key: os.environ/OPENAI_API_KEY
  # Extra aliases to try models: set API_LLM_MODEL to one of them. The Windows host's Ollama
  # is reached through Docker Desktop's host.docker.internal (Ollama must listen on 0.0.0.0).
  - model_name: claude-sonnet-5-5
    litellm_params:
      model: anthropic/claude-sonnet-5-5   # key: ANTHROPIC_API_KEY in the proxy's environment
      drop_params: true   # it accepts only temperature=1; the API asks for 0.2
  - model_name: claude-haiku-5-5
    litellm_params:
      model: anthropic/claude-haiku-5-5
      drop_params: true   # same as sonnet: drop what the model doesn't accept
  - model_name: mistral-small
    litellm_params:
      model: ollama_chat/mistral-small:latest
      api_base: http://host.docker.internal:11434
litellm_settings:
  num_retries: 0                 # the API's corrective retry is the only retry
  request_timeout: 55            # just under API_LLM_TIMEOUT_S (60)
  turn_off_message_logging: false # never log prompts or responses
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_prompts_in_spend_logs: true
