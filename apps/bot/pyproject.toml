[project]
name = "engleks-bot"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = [
    "aiogram>=3",
    "engleks-contracts",
    "httpx2>=2.16.0",
    "pydantic-settings>=2.6",
    "structlog",
]

[project.scripts]
engleks-bot = "engleks_bot.main:main"

[tool.uv.sources]
engleks-contracts = { workspace = true }

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"
