[project]
name = "engleks-api"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = [
    "alembic",
    "asyncpg",
    "engleks-contracts",
    "fastapi>=0.115",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "structlog",
    "uvicorn[standard]",
]

[tool.uv.sources]
engleks-contracts = { workspace = true }

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"
